# Railway deployment config for the FastAPI backend.
# Add a PostgreSQL plugin in the Railway project; it injects DATABASE_URL.
# Set ANTHROPIC_API_KEY, JSEARCH_API_KEY, and CORS_ORIGINS in the service vars.

[build]
builder = "nixpacks"

[deploy]
# Run migrations before the new deploy goes live.
preDeployCommand = "alembic upgrade head"
startCommand = "uvicorn levelmatch.main:app --app-dir src --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
